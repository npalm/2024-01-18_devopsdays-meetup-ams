name: Test Debugger Action
on: 
  pull_request:
  workflow_dispatch:

jobs:
  oidc_debug_test:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    name: A test of the oidc debugger
    steps:
      - name: Debug OIDC Claims
        uses: steve-todorov/oidc-debugger-action@4d046d82b137c523e98a9d0069cb05b84032addb
        with:
          audience: '${{ github.server_url }}/${{ github.repository }}'